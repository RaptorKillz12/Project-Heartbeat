name: Export Project Heartbeat Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project Heartbeat
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            unzip \
            ffmpeg \
            pkg-config \
            build-essential \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev

          python -m pip install --upgrade pip
          pip install scons

      - name: Verify FFmpeg
        run: |
          command -v ffmpeg
          ffmpeg -version
          pkg-config --modversion libavcodec

      - name: Clone Shinobu
        run: |
          git clone --recursive \
            https://github.com/EIRTeam/shinobu.git

      - name: Debug FFmpeg configuration
        working-directory: shinobu
        run: |
          sed -n '1,160p' modules/ffmpeg/config.py
          grep -R -n \
            "ffmpeg path not found" modules/ffmpeg || true
          command -v ffmpeg
          ls -l /usr/bin/ffmpeg

      - name: Build Shinobu editor
        working-directory: shinobu
        run: |
          scons platform=linuxbsd target=editor -j2

      - name: Verify editor build
        run: |
          find shinobu/bin -maxdepth 1 -type f -print

          EDITOR="$(find shinobu/bin -maxdepth 1 \
            -type f -name '*editor*' -print -quit)"

          if [ -z "$EDITOR" ]; then
            echo "ERROR: Shinobu editor was not generated."
            exit 1
          fi

          echo "Editor found: $EDITOR"

      - name: Import Project Heartbeat
        run: |
          EDITOR="$(find shinobu/bin -maxdepth 1 \
            -type f -name '*editor*' -print -quit)"

          "$EDITOR" \
            --headless \
            --path . \
            --quit

      - name: Export Android
        run: |
          mkdir -p build

          EDITOR="$(find shinobu/bin -maxdepth 1 \
            -type f -name '*editor*' -print -quit)"

          "$EDITOR" \
            --headless \
            --path . \
            --export-release "Android" \
            build/ProjectHeartbeat.apk

      - name: Verify APK
        run: |
          if [ ! -s build/ProjectHeartbeat.apk ]; then
            echo "ERROR: APK missing or empty."
            exit 1
          fi

          ls -lh build/ProjectHeartbeat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectHeartbeat-Android
          path: build/ProjectHeartbeat.apk
          if-no-files-found: error
