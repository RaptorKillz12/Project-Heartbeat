name: Export Project Heartbeat Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project Heartbeat
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            unzip \
            ffmpeg \
            pkg-config \
            build-essential \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev

          python -m pip install --upgrade pip
          pip install scons

      - name: Verify FFmpeg
        run: |
          echo "FFmpeg executable:"
          command -v ffmpeg
          ffmpeg -version

          echo "FFmpeg libraries:"
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat
          pkg-config --modversion libavutil

          echo "FFmpeg prefix:"
          pkg-config --variable=prefix libavcodec

      - name: Clone Shinobu
        run: |
          git clone --recursive \
            https://github.com/EIRTeam/shinobu.git

      - name: Inspect FFmpeg configuration
        working-directory: shinobu
        run: |
          echo "=== FFmpeg config.py ==="
          sed -n '1,200p' modules/ffmpeg/config.py

          echo "=== FFmpeg path references ==="
          grep -R -n \
            "ffmpeg path not found" \
            modules/ffmpeg || true

      - name: Build Shinobu editor
        working-directory: shinobu
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          FFMPEG_PATH: /usr
        run: |
          export PATH="/usr/bin:$PATH"

          echo "FFmpeg: $(command -v ffmpeg)"
          echo "FFMPEG_PATH=$FFMPEG_PATH"

          scons platform=linuxbsd target=editor -j2

      - name: Verify editor build
        run: |
          find shinobu/bin -maxdepth 1 -type f -print

          EDITOR="$(find shinobu/bin -maxdepth 1 \
            -type f -name '*editor*' -print -quit)"

          if [ -z "$EDITOR" ]; then
            echo "ERROR: Shinobu editor was not generated."
            exit 1
          fi

      - name: Import Project Heartbeat
        run: |
          EDITOR="$(find shinobu/bin -maxdepth 1 \
            -type f -name '*editor*' -print -quit)"

          "$EDITOR" --headless --path . --quit

      - name: Export Android
        run: |
          mkdir -p build

          EDITOR="$(find shinobu/bin -maxdepth 1 \
            -type f -name '*editor*' -print -quit)"

          "$EDITOR" \
            --headless \
            --path . \
            --export-release "Android" \
            build/ProjectHeartbeat.apk

      - name: Verify APK
        run: |
          test -s build/ProjectHeartbeat.apk
          ls -lh build/ProjectHeartbeat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectHeartbeat-Android
          path: build/ProjectHeartbeat.apk
          if-no-files-found: error
