name: Export Project Heartbeat Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project Heartbeat
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            unzip \
            ffmpeg \
            pkg-config \
            build-essential
          python -m pip install --upgrade pip
          pip install scons

      - name: Verify FFmpeg
        run: |
          which ffmpeg
          ffmpeg -version
          pkg-config --modversion libavcodec || true

      - name: Clone Shinobu
        run: |
          git clone --recursive \
            https://github.com/EIRTeam/shinobu.git

      - name: Verify Shinobu FFmpeg configuration
        working-directory: shinobu
        run: |
          test -f modules/ffmpeg/config.py
          sed -n '1,100p' modules/ffmpeg/config.py

      - name: Build Shinobu editor
        working-directory: shinobu
        run: |
          scons platform=linuxbsd target=editor -j2

      - name: Verify editor build
        run: |
          find shinobu/bin -maxdepth 1 -type f -print
          test -n "$(find shinobu/bin -maxdepth 1 \
            -type f -name '*editor*' -print -quit)"

      - name: Import Project Heartbeat
        run: |
          EDITOR="$(find shinobu/bin -maxdepth 1 \
            -type f -name '*editor*' -print -quit)"
          "$EDITOR" --headless --path . --quit

      - name: Export Android
        run: |
          mkdir -p build
          EDITOR="$(find shinobu/bin -maxdepth 1 \
            -type f -name '*editor*' -print -quit)"
          "$EDITOR" \
            --headless \
            --path . \
            --export-release "Android" \
            build/ProjectHeartbeat.apk

      - name: Verify APK
        run: |
          test -s build/ProjectHeartbeat.apk
          ls -lh build/ProjectHeartbeat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectHeartbeat-Android
          path: build/ProjectHeartbeat.apk
          if-no-files-found: error
